apiVersion: 1

# Grafana loads any dashboard JSON found under `path` on boot and re-reads it
# every `updateIntervalSeconds`. The path is a container path — see the
# ./observability/grafana/dashboards bind-mount in
# docker-compose.observability.yml.
providers:
  - name: confluence
    orgId: 1
    folder: Confluence
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    # Lets you edit a panel in the UI and keep the change until the next reload.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
