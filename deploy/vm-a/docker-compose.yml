# VM-A — realtime box: bot-service (8000) + agent worker.
#
# Phase 3 (local test): LIVEKIT_URL points at LiveKit Cloud; run this alone.
# Phase 6 (prod VM):    run ALONGSIDE the livekit/generate compose on the VM.
#   On Linux prod, prefer host networking so agent→127.0.0.1:8000 and
#   agent→local livekit work; then set BRIDGE_INTERNAL_URL=http://127.0.0.1:8000.
#   (Locally on Win/Mac, the bridge network + service DNS below is simpler.)
#
# Build the image once: `docker build -t my-agent:latest ../../my-agent`
# (requires Docker Desktop running).

services:
  bot-service:
    image: my-agent:latest
    build:
      context: ../../my-agent
    # --no-sync: skip the runtime package rebuild (~20s). Deps are baked at image build.
    command: ["uv", "run", "--no-sync", "uvicorn", "src.bot_service:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    environment:
      # Observability → local Alloy collector. On a host-network VM use 127.0.0.1.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "bot-service"
    ports:
      - "8000:8000"        # public (Recall loads /bot-page, posts /recall-webhook)
    restart: unless-stopped

  agent:
    image: my-agent:latest
    command: ["uv", "run", "--no-sync", "src/agent.py", "start"]
    env_file: [.env]
    environment:
      # Bridge network → reach bot-service by its compose service name.
      # On the prod host-network VM, override to http://127.0.0.1:8000.
      BRIDGE_INTERNAL_URL: "http://bot-service:8000"
      # Observability → local Alloy collector (host-network VM: 127.0.0.1).
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "agent-worker"
      METRICS_PORT: "9464"   # Prometheus scrape target (Alloy → agent:9464)
    depends_on:
      - bot-service
    restart: unless-stopped

  # Grafana Alloy — per-VM metrics scrape + OTLP trace receiver → Grafana Cloud.
  # Config + creds live in ../observability/ (repo is cloned whole onto the VM).
  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    env_file: [../observability/alloy.env]
    volumes:
      - ../observability/alloy/config-vm-a.alloy:/etc/alloy/config.alloy:ro
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "127.0.0.1:12345:12345"   # Alloy debug UI — localhost only
    restart: unless-stopped
