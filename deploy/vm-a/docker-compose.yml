# VM-A — realtime box: bot-service (8000) + agent worker.
#
# TLS/public HTTPS is handled by the SEPARATE self-hosted LiveKit stack
# (~/livekit/vm-a-livekit-jarvis.../ on the VM — its own docker-compose.yaml +
# caddy.yaml, all network_mode: host). That Caddy already automates a cert for
# bot.104-43-112-6.nip.io and proxies it to localhost:8000. Do NOT add a
# second Caddy here — two Caddys both binding :443 on the same VM just fight
# over the port. Do NOT edit anything under ~/livekit/ from this repo either;
# that stack is managed separately, out of band.
#
# Because the LiveKit Caddy dials plain "localhost:8000" (it's on host
# networking), bot-service below publishes to the VM's loopback so that
# Caddy can actually reach it — not to 0.0.0.0, so bot-service itself is never
# directly reachable from the internet, only via Caddy's TLS front door.
#
# ENV FILE SOURCE (deploy): deploy/vm-a/.env  (co-located with this file — env_file: [.env])
#   Do NOT use the repo-root Confluence/.env or my-agent/.env.local here.
#   For local dev/testing use Confluence/docker-compose.local.yml instead.
#
# Build the image once: `docker build -t my-agent:latest ../../my-agent`
# (requires Docker Desktop running).

services:
  bot-service:
    image: my-agent:latest
    build:
      context: ../../my-agent
    command: ["uv", "run", "--no-sync", "uvicorn", "src.bot_service:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    ports:
      - "127.0.0.1:8000:8000"   # loopback only — reached by the host-networked LiveKit Caddy via localhost:8000
    extra_hosts:
      # Hairpin-NAT fix (documented in deploy/PROCESS.md, validated 2026-06-15):
      # LIVEKIT_URL is this VM's own public domain. Without this, a container
      # on the VM cannot connect back out to its own public IP to reach it.
      - "vm-a-livekit-jarvis.southeastasia.cloudapp.azure.com:host-gateway"
    restart: unless-stopped

  agent:
    image: my-agent:latest
    command: ["uv", "run", "--no-sync", "src/agent.py", "start"]
    env_file: [.env]
    environment:
      BRIDGE_INTERNAL_URL: "http://bot-service:8000"
    extra_hosts:
      - "vm-a-livekit-jarvis.southeastasia.cloudapp.azure.com:host-gateway"
    depends_on:
      - bot-service
    restart: unless-stopped
