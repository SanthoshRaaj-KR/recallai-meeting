<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Jarvis LiveKit Bridge</title>
</head>
<body>
  <div id="status">Connecting...</div>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.18.9/dist/livekit-client.umd.min.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const lkUrl = params.get('url');
      const token = params.get('token');
      const roomName = params.get('room');
      const statusEl = document.getElementById('status');

      function setStatus(msg) {
        statusEl.textContent = msg;
        console.log('[bot.html]', msg);
      }

      if (!lkUrl || !token) {
        setStatus('Missing url or token query param');
        return;
      }

      const room = new LivekitClient.Room({
        adaptiveStream: false,
        dynacast: false,
      });

      // Track sid -> <audio> element map so we can clean up on unsubscribe.
      const audioElements = new Map();

      room.on(LivekitClient.RoomEvent.Connected, () => {
        setStatus('Connected to room ' + (roomName || '<unknown>'));
        // Defensive: ensure audio playback is allowed (Recall headless Chrome usually permits).
        if (typeof room.startAudio === 'function') {
          room.startAudio().catch((e) => console.warn('[bot.html] startAudio() rejected:', e));
        }
      });

      room.on(LivekitClient.RoomEvent.Disconnected, (reason) => {
        setStatus('Disconnected: ' + reason);
      });

      room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        console.log('[bot.html] TrackSubscribed kind=', track.kind, 'sid=', track.sid);
        if (track.kind === LivekitClient.Track.Kind.Audio) {
          // Remove any stale element for this sid before attaching a fresh one.
          if (audioElements.has(track.sid)) {
            const stale = audioElements.get(track.sid);
            stale.pause();
            stale.remove();
            audioElements.delete(track.sid);
          }
          const audioEl = track.attach();
          audioEl.volume = 1.0;
          audioEl.autoplay = true;
          document.body.appendChild(audioEl);
          audioElements.set(track.sid, audioEl);
          const playPromise = audioEl.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch((e) => console.warn('[bot.html] audioEl.play() blocked:', e));
          }
        }
      });

      room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
        console.log('[bot.html] TrackUnsubscribed kind=', track.kind, 'sid=', track.sid);
        if (track.kind === LivekitClient.Track.Kind.Audio) {
          const audioEl = audioElements.get(track.sid);
          if (audioEl) {
            audioEl.pause();
            audioEl.remove();
            audioElements.delete(track.sid);
          }
        }
      });

      room.connect(lkUrl, token)
        .then(() => setStatus('room.connect resolved'))
        .catch((e) => {
          console.error('[bot.html] room.connect failed:', e);
          setStatus('Connect failed: ' + e.message);
        });
    })();
  </script>

  <!-- Phase 6: Publisher IIFE — meeting audio capture -> LiveKit publish -->
  <!-- Recall headless Chrome auto-grants getUserMedia microphone permission. -->
  <!-- The "microphone" source is the mixed audio from all meeting participants. -->
  <script>
  (function () {
    'use strict';

    var params = new URLSearchParams(window.location.search);
    var lkUrl = params.get('url');
    var pubToken = params.get('pub_token');

    if (!lkUrl || !pubToken) {
      console.warn('[bot.html][publisher] Missing pub_token — meeting audio will NOT be published to LiveKit');
      return;
    }

    // Second Room instance: publisher only.
    // adaptiveStream/dynacast disabled to minimise background processing (Pitfall 3).
    var pubRoom = new LivekitClient.Room({
      adaptiveStream: false,
      dynacast: false,
    });

    pubRoom.on(LivekitClient.RoomEvent.Connected, function () {
      console.log('[bot.html][publisher] Connected, identity:', pubRoom.localParticipant.identity);
      // getUserMedia called INSIDE Connected handler — room must be up before publishTrack (Pitfall 2).
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function (mediaStream) {
          var meetingAudioTrack = mediaStream.getAudioTracks()[0];
          if (!meetingAudioTrack) {
            console.error('[bot.html][publisher] getUserMedia returned no audio tracks');
            return;
          }
          return pubRoom.localParticipant.publishTrack(meetingAudioTrack, {
            name: 'recall-meeting-audio',
            source: LivekitClient.Track.Source.Microphone,
          });
        })
        .then(function () {
          console.log('[bot.html][publisher] Meeting audio published to LiveKit room (recall-meeting-audio)');
        })
        .catch(function (e) {
          console.error('[bot.html][publisher] getUserMedia or publishTrack failed:', e);
        });
    });

    pubRoom.on(LivekitClient.RoomEvent.Disconnected, function (reason) {
      console.warn('[bot.html][publisher] Disconnected:', reason);
    });

    pubRoom.connect(lkUrl, pubToken)
      .catch(function (e) {
        console.error('[bot.html][publisher] connect failed:', e);
      });
  })();
  </script>
</body>
</html>
