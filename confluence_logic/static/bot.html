<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Jarvis LiveKit Bridge</title>
</head>
<body>
  <div id="status">Connecting...</div>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.18.9/dist/livekit-client.umd.min.js"></script>

  <!--
    ROOM 1 (subscriber) — "token" identity: "recall-listener-{session_id}" (or anything)
    Purpose: plays back Jarvis TTS audio into the meeting via the Recall bot's speakers.
    Filters: plays audio from any participant that is NOT "recall-browser-{session_id}"
             (i.e. plays the agent's TTS audio, not the meeting audio echo).
  -->
  <script>
  (function () {
    'use strict';

    var params    = new URLSearchParams(window.location.search);
    var lkUrl     = params.get('url');
    var token     = params.get('token');
    var roomName  = params.get('room');
    var statusEl  = document.getElementById('status');

    function setStatus(msg) {
      statusEl.textContent = msg;
      console.log('[bot.html][subscriber]', msg);
    }

    // Log all received params so we can verify they're correct in Recall's console
    console.log('[bot.html][subscriber] URL params: url=' + lkUrl + ' room=' + roomName + ' token=' + (token ? token.substring(0, 20) + '...' : 'MISSING'));

    if (!lkUrl || !token) {
      setStatus('ERROR: Missing url or token param');
      return;
    }

    var room = new LivekitClient.Room({
      adaptiveStream: false,
      dynacast: false,
    });

    // ── Audio playback ─────────────────────────────────────────────────────
    // Primary path: HTMLAudioElement via track.attach().
    // Recall's headless Chrome captures audio from <audio> elements and injects it
    // into the meeting. This is the reliable path that guarantees delivery.
    //
    // Secondary path: WebAudio API (AudioContext) — used opportunistically if the
    // context is already 'running' when a track arrives. If AudioContext is suspended,
    // we keep the HTMLAudioElement playing and attempt a background resume() without
    // interrupting the audio stream.
    //
    // Design note: WebAudio was previously the primary path, but ctx.state === 'running'
    // is never true synchronously after context creation (resume() is async). The <audio>
    // element path is therefore always the actual delivery mechanism.
    var audioCtx = null;
    var audioNodes = new Map(); // track.sid → AudioNode (WebAudio) or HTMLAudioElement

    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({
          latencyHint: 'interactive',
        });
        console.log('[bot.html][subscriber] AudioContext created, state=' + audioCtx.state);
      }
      if (audioCtx.state !== 'running') {
        audioCtx.resume().then(function () {
          console.log('[bot.html][subscriber] AudioContext resumed, state=' + audioCtx.state);
        }).catch(function (e) {
          console.warn('[bot.html][subscriber] AudioContext resume failed:', e);
        });
      }
      return audioCtx;
    }

    function _attachViaWebAudio(rawTrack, track, identity) {
      try {
        var ctx = audioCtx;
        var ms  = new MediaStream([rawTrack]);
        var src = ctx.createMediaStreamSource(ms);
        src.connect(ctx.destination);
        audioNodes.set(track.sid, src);
        console.log('[bot.html][subscriber] WebAudio playing from: ' + identity + ' (ctx=' + ctx.state + ')');
      } catch (e) {
        console.warn('[bot.html][subscriber] WebAudio connect failed for ' + identity + ' — falling back to <audio>:', e);
        playTrackFallback(track, identity);
      }
    }

    function attachTrack(track, identity, attempt) {
      attempt = attempt || 1;

      var rawTrack = track.mediaStreamTrack;
      if (!rawTrack) {
        if (attempt <= 5) {
          console.warn('[bot.html][subscriber] mediaStreamTrack null for ' + identity + ' — retry ' + attempt + '/5');
          setTimeout(function () { attachTrack(track, identity, attempt + 1); }, 250);
        } else {
          console.warn('[bot.html][subscriber] mediaStreamTrack never arrived for ' + identity + ' — fallback <audio>');
          playTrackFallback(track, identity);
        }
        return;
      }

      // Primary path: HTMLAudioElement via track.attach().
      // Recall's headless Chrome reliably captures audio from <audio> elements.
      // We use this as the primary path to guarantee audio reaches the meeting.
      //
      // NOTE: The previous implementation used WebAudio (AudioContext) as primary with
      // HTMLAudioElement as fallback. This was broken because:
      //   1. ensureAudioCtx() fires ctx.resume() as a fire-and-forget Promise.
      //   2. The synchronous ctx.state check immediately after is ALWAYS 'suspended'
      //      (resume() is async — state hasn't changed yet).
      //   3. So the WebAudio path was never taken directly; it fell into the
      //      'AudioContext suspended' branch every time.
      // The correct fix is to use HTMLAudioElement as primary (always reliable in Recall's
      // headless Chrome) and layer WebAudio on top only if the context is confirmed running.
      var audioEl = playTrackFallback(track, identity);

      // Secondary: also wire into AudioContext if it's already running (or becomes running).
      // This is opportunistic — if WebAudio context is available, we can use it for volume
      // control and mixing. We do NOT rely on this for audio delivery to the meeting.
      var ctx = ensureAudioCtx();
      if (ctx.state === 'running') {
        // AudioContext is already running — wire WebAudio source in addition to <audio>.
        // Both will play; this is intentional (WebAudio gives more control).
        // Disconnect the <audio> element from the audioNodes map and replace with WebAudio node.
        if (audioEl) {
          audioEl.pause();
          if (audioEl.parentNode) audioEl.parentNode.removeChild(audioEl);
          audioNodes.delete(track.sid);
        }
        _attachViaWebAudio(rawTrack, track, identity);
      } else {
        // AudioContext not yet running — try resume. If it succeeds, we keep HTMLAudioElement
        // (already playing) and do not switch to WebAudio to avoid a gap in playback.
        ctx.resume().then(function () {
          console.log('[bot.html][subscriber] AudioContext resumed after attach (state=' + (audioCtx && audioCtx.state) + ')');
        }).catch(function (e) {
          console.warn('[bot.html][subscriber] AudioContext resume failed after attach:', e);
        });
      }
    }

    function playTrackFallback(track, identity) {
      // Primary HTMLAudioElement path — reliable in Recall's headless Chrome.
      // Returns the element so callers can reference or swap it out.
      var audioEl = track.attach();
      audioEl.volume = 1.0;
      audioEl.autoplay = true;
      document.body.appendChild(audioEl);
      audioEl.play().catch(function (e) {
        console.warn('[bot.html][subscriber] audioEl.play() blocked for ' + identity + ':', e);
      });
      audioNodes.set(track.sid, audioEl);
      console.log('[bot.html][subscriber] <audio> playing from: ' + identity);
      return audioEl;
    }

    room.on(LivekitClient.RoomEvent.Connected, function () {
      setStatus('Subscriber connected to room: ' + (roomName || '<unknown>'));
      // Pre-warm AudioContext — before any track arrives so it's running when TrackSubscribed fires.
      var ctx = ensureAudioCtx();
      console.log('[bot.html][subscriber] AudioContext state after pre-warm: ' + ctx.state);
      // room.startAudio() handles LiveKit's internal audio enabling (no-op if already enabled)
      room.startAudio().catch(function (e) {
        console.warn('[bot.html][subscriber] room.startAudio() failed (may be normal):', e);
      });
    });

    room.on(LivekitClient.RoomEvent.Disconnected, function (reason) {
      setStatus('Subscriber disconnected: ' + reason);
    });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, function (track, pub, participant) {
      console.log(
        '[bot.html][subscriber] TrackSubscribed kind=' + track.kind +
        ' sid=' + track.sid + ' from=' + participant.identity
      );

      if (track.kind !== LivekitClient.Track.Kind.Audio) return;

      // Play audio from any participant that is NOT the Recall publisher.
      // recall-browser-* is the meeting audio echo — skip it.
      if (participant.identity.startsWith('recall-browser-')) {
        console.log('[bot.html][subscriber] Skipping recall-browser: ' + participant.identity);
        return;
      }

      // Clean up any stale node for this sid (e.g. after reconnect)
      var existing = audioNodes.get(track.sid);
      if (existing) {
        if (typeof existing.disconnect === 'function') {
          try { existing.disconnect(); } catch (_) {}
        } else if (existing.pause) {
          existing.pause();
          existing.remove();
        }
        audioNodes.delete(track.sid);
      }

      attachTrack(track, participant.identity, 1);
    });

    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, function (track, pub, participant) {
      if (track.kind !== LivekitClient.Track.Kind.Audio) return;
      if (participant.identity.startsWith('recall-browser-')) return;

      var node = audioNodes.get(track.sid);
      if (node) {
        if (typeof node.disconnect === 'function') {
          try { node.disconnect(); } catch (_) {}
        } else if (node.pause) {
          node.pause();
          node.remove();
        }
        audioNodes.delete(track.sid);
      }
    });

    room.connect(lkUrl, token)
      .then(function () { setStatus('Subscriber room.connect resolved'); })
      .catch(function (e) {
        console.error('[bot.html][subscriber] room.connect failed:', e);
        setStatus('Connect failed: ' + e.message);
      });

  })();
  </script>

  <!--
    ROOM 2 (publisher) — "pub_token" identity: MUST BE "recall-browser-{session_id}"
    Purpose: captures meeting audio via getUserMedia() and publishes it to LiveKit.
    The AgentSession in agent_worker.py subscribes to THIS participant's audio for STT.

    CRITICAL IDENTITY CONTRACT:
      The pub_token your backend mints MUST grant identity = "recall-browser-{session_id}".
      This MUST match the participant_identity in agent_worker.py's RoomOptions.
      If it doesn't match, the AgentSession STT never subscribes to this audio track
      and Jarvis is completely deaf — no transcripts, no wake word, no response.

    Recall headless Chrome auto-grants getUserMedia microphone permission.
    The "microphone" source inside the Recall bot IS the mixed meeting audio
    (all participants combined) — NOT just your laptop's microphone.
  -->
  <script>
  (function () {
    'use strict';

    var params   = new URLSearchParams(window.location.search);
    var lkUrl    = params.get('url');
    var pubToken = params.get('pub_token');

    if (!lkUrl || !pubToken) {
      console.warn('[bot.html][publisher] Missing pub_token — meeting audio will NOT reach Jarvis');
      return;
    }

    var pubRoom = new LivekitClient.Room({
      adaptiveStream: false,
      dynacast: false,
    });

    pubRoom.on(LivekitClient.RoomEvent.Connected, function () {
      var identity = pubRoom.localParticipant.identity;
      console.log('[bot.html][publisher] Connected as identity: ' + identity);

      // SANITY CHECK: warn loudly if identity doesn't match what agent_worker.py expects
      if (!identity.startsWith('recall-browser-')) {
        console.error(
          '[bot.html][publisher] ⚠️  IDENTITY MISMATCH! ' +
          'pub_token grants identity="' + identity + '" ' +
          'but agent_worker.py expects identity starting with "recall-browser-". ' +
          'Jarvis will be deaf. Fix your token minting backend.'
        );
      }

      // getUserMedia is called INSIDE the Connected handler.
      // The room must be connected before publishTrack() is called.
      navigator.mediaDevices.getUserMedia({
        audio: {
          // In a Recall headless-Chrome bot the "microphone" is a digital WebRTC
          // stream, not a physical acoustic echo path. Browser AEC/NS algorithms
          // designed for physical rooms create metallic artifacts (chirping/stuttering)
          // on this digital signal. Turn them all off; the LiveKit agent handles
          // acoustic separation via its own AEC warmup on the publisher side.
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
        }
      })
      .then(function (mediaStream) {
        var meetingAudioTrack = mediaStream.getAudioTracks()[0];
        if (!meetingAudioTrack) {
          console.error('[bot.html][publisher] getUserMedia returned no audio tracks');
          return;
        }
        return pubRoom.localParticipant.publishTrack(meetingAudioTrack, {
          name: 'recall-meeting-audio',
          source: LivekitClient.Track.Source.Microphone,
        });
      })
      .then(function () {
        console.log('[bot.html][publisher] ✅ Meeting audio published to LiveKit as: ' + pubRoom.localParticipant.identity);
      })
      .catch(function (e) {
        console.error('[bot.html][publisher] getUserMedia or publishTrack failed:', e);
      });
    });

    pubRoom.on(LivekitClient.RoomEvent.Disconnected, function (reason) {
      console.warn('[bot.html][publisher] Disconnected:', reason);
    });

    pubRoom.connect(lkUrl, pubToken)
      .catch(function (e) {
        console.error('[bot.html][publisher] connect failed:', e);
      });

  })();
  </script>

</body>
</html>
